name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_REPORT_LABEL: "CI Build"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify build configuration
        run: npm run verify:config

      - name: Run typecheck
        run: npm run typecheck

      - name: Build dashboard
        run: npm run build
